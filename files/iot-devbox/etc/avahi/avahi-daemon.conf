# See avahi-daemon.conf(5) for more information on this configuration
# file!

[server]
#host-name=foo
#host-name-from-machine-id=no
#domain-name=local
#browse-domains=0pointer.de, zeroconf.org
use-ipv4=yes
use-ipv6=yes
#allow-interfaces=eth0
#deny-interfaces=eth1
# Avahi probes for its own name on every interface it considers relevant.
# tailscale0 is not a broadcast segment like the others, and the probe sent
# there came back looking like a different host answering for this name, so
# avahi concluded the name was taken and renamed itself to -14. That happens
# on every boot, silently, which is why the .local name stopped resolving.
# Nothing else on the tailnet or the LAN ever claimed the name.
#
# Denying just this interface rather than allowlisting the LAN one: the wifi
# and ethernet names are hardware-dependent, and podman invents new bridges
# whenever a compose stack comes up, so an allowlist would need editing every
# time the machine changes shape.
deny-interfaces=tailscale0
#check-response-ttl=no
#use-iff-running=no
#enable-dbus=yes
#disallow-other-stacks=no
#allow-point-to-point=no
#cache-entries-max=4096
#clients-max=4096
#objects-per-client-max=1024
#entries-per-entry-group-max=32
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[wide-area]
#enable-wide-area=no

[publish]
#disable-publishing=no
#disable-user-service-publishing=no
#add-service-cookie=no
#publish-addresses=yes
publish-hinfo=no
publish-workstation=no
#publish-domain=yes
#publish-dns-servers=192.168.50.1, 192.168.50.2
#publish-resolv-conf-dns-servers=yes
#publish-aaaa-on-ipv4=yes
#publish-a-on-ipv6=no

[reflector]
#enable-reflector=no
#reflect-ipv=no
#reflect-filters=_airplay._tcp.local,_raop._tcp.local

[rlimits]
#rlimit-as=
#rlimit-core=0
#rlimit-data=8388608
#rlimit-fsize=0
#rlimit-nofile=768
#rlimit-stack=8388608
#rlimit-nproc=3
