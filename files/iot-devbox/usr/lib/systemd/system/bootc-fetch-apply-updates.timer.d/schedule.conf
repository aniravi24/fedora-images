# bootc-fetch-apply-updates runs `bootc upgrade --apply`, which REBOOTS the box
# when it stages a new deployment. Upstream fires it 1h after boot and every 8h
# after that with up to 2h of jitter, so on a machine running long jobs a reboot
# can land in the middle of the afternoon.
#
# Pin it to 04:00 instead, which is what the Ubuntu box did via
# Unattended-Upgrade::Automatic-Reboot-Time. The wallabag maintenance timer runs
# at 03:00 Eastern and takes its backup before touching anything, so it has
# finished well before this.
#
# Clearing OnBootSec and OnUnitInactiveSec first is required: drop-ins add to
# these lists rather than replacing them, so without the empty assignment the
# stock 8-hourly schedule would still fire alongside the 04:00 one.
[Timer]
OnBootSec=
OnUnitInactiveSec=
RandomizedDelaySec=
OnCalendar=*-*-* 04:00:00
RandomizedDelaySec=15m
Persistent=true
