name: bluebuild
on:
  schedule:
    # Upstream rebuilds aurora-dx:stable weekly, Tuesdays 01:00 UTC.
    - cron: "00 03 * * TUE"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - aurora-ani.yml
          - iot-devbox.yml
    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.12
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          # verify the cosign signature on the BlueBuild CLI before running it
          verify_install: true
