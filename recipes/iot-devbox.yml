---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: iot-devbox
description: Fedora IoT with the packages a development box needs.

base-image: quay.io/fedora/fedora-iot
image-version: latest

modules:
  # Only /etc and /usr: ostree symlinks the rest to /var.
  - type: files
    files:
      - source: iot-devbox
        destination: /

  # IoT ships bare. podman, NetworkManager-wifi, wpa_supplicant and the
  # wireless firmware are already there; everything below is not.
  - type: dnf
    repos:
      # Fedora ships 1.98.8; upstream tracks current. Tailscale is how this box
      # is reached at all, so it is not optional.
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
    install:
      packages:
        - tailscale
        - audit
        # Terminal setup, mirroring the aurora image's Brewfile so both machines
        # feel the same. Aurora gets these from Homebrew only because the ublue
        # base ships it; bootstrapping brew on IoT would mean a first-boot unit
        # and a second update path for no gain, so they come from Fedora here
        # and update with the image. starship is not packaged and is fetched
        # from its GitHub release below. lazydocker, dive, dust, doggo and
        # watchman are desktop conveniences and are deliberately not carried.
        - zsh
        - chezmoi
        - age
        - atuin
        - direnv
        - zoxide
        - eza
        - bat
        - fd-find
        - ripgrep
        - fzf
        - yq
        - gh
        - k9s
        - duf
        - procs
        - trash-cli
        - tealdeer
        # semanage, for the mise/node SELinux relabel. IoT ships bare.
        - policycoreutils-python-utils
        - firewalld
        - git
        - unzip
        - gcc
        - gcc-c++
        - make
        - avahi
        - nss-mdns
        - mosh
        - openssh-server
        - rsync
        - jq
        - tar
        - zstd
        - bubblewrap
        - distrobox
        - moby-engine
        - docker-compose
        # chromium runtime libs: playwright's --with-deps only knows apt
        - alsa-lib
        - at-spi2-atk
        - atk
        - cups-libs
        - libdrm
        - libX11
        - libXcomposite
        - libXdamage
        - libXext
        - libXfixes
        - libXrandr
        - libxkbcommon
        - mesa-libgbm
        - nspr
        - nss
        - pango
        - cairo

  # starship is not in the Fedora repos. Resolve the latest release at build
  # time rather than pinning a version: CI rebuilds, so it tracks upstream with
  # nothing to maintain. Same approach as Handy in the aurora recipe.
  #
  # Not `curl | sh` with upstream's install.sh: that does arch detection we do
  # not need in a fixed x86_64 image, and it does not verify anything. The
  # release publishes a .sha256 per asset, so download, check, then extract.
  - type: script
    snippets:
      - |
        set -euo pipefail
        api=https://api.github.com/repos/starship/starship/releases/latest
        asset=starship-x86_64-unknown-linux-gnu.tar.gz
        url=$(curl -fsSL "$api" | jq -er --arg a "$asset" \
          '.assets[] | select(.name == $a) | .browser_download_url')
        sha=$(curl -fsSL "$api" | jq -er --arg a "$asset.sha256" \
          '.assets[] | select(.name == $a) | .browser_download_url')
        tmp=$(mktemp -d)
        curl -fsSL "$url" -o "$tmp/$asset"
        curl -fsSL "$sha" -o "$tmp/$asset.sha256"
        # upstream's .sha256 is the bare digest, so build a line checksum reads
        echo "$(cat "$tmp/$asset.sha256" | tr -d '[:space:]')  $tmp/$asset" \
          | sha256sum -c - || { echo "starship checksum mismatch"; exit 1; }
        tar xzf "$tmp/$asset" -C /usr/bin starship
        chmod 0755 /usr/bin/starship
        rm -rf "$tmp"
        /usr/bin/starship --version

  - type: systemd
    system:
      enabled:
        - console-powerdown.service
        # portless installs a system unit whose ExecStart is node under
        # ~/.local/share/mise. init_t may not execute data_home_t, so it
        # dies with 203/EXEC and installdeps.sh reinstalls it, with sudo,
        # on every run.
        - aurora-ani-mise-selinux.service
        # Sets zsh as the login shell and joins the developer groups, same as
        # the desktop. Without it the box logs in to bash and none of the zsh
        # config applies.
        - aurora-ani-groups.service
        - aurora-ani-groups.path
        - avahi-daemon.service
        - sshd.service
        - tailscaled.service
        - auditd.service
        - firewalld.service
        - docker.service
        # greenboot rolls a failed update back on its own
        - bootc-fetch-apply-updates.timer

  - type: signing
