---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: aurora
description: Custom Aurora image.

base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

modules:
  # Only /etc and /usr: rpm-ostree symlinks the rest to /var.
  - type: files
    files:
      - source: aurora
        destination: /

  # ghostty is not in Fedora and has no Flathub build, hence the COPR.
  - type: dnf
    repos:
      copr:
        - ponesicek/ghostty-bin
    install:
      packages:
        # Offline speech-to-text (github.com/cjpais/Handy). Not on Flathub and
        # not in any Fedora repo, so the release RPM is pinned by URL. Bump the
        # version here when upgrading; Renovate can track the GitHub release.
        - https://github.com/cjpais/Handy/releases/download/v0.9.6/Handy-0.9.6-1.x86_64.rpm
        # Wayland text injection, required by Handy to type into the focused app.
        - wtype
        - ghostty
        - syncthing
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        # Fonts. Aurora already ships Noto (all scripts + emoji), Cantarell and
        # Adwaita, so only these four are missing for web and code.
        # liberation is metric-compatible with Arial/Times/Courier.
        - liberation-fonts
        - fira-code-fonts
        - adobe-source-code-pro-fonts
        - dejavu-fonts-all

  # Nerd Font glyphs for the shell prompt, eza, lazygit. Not packaged by
  # Fedora; this module refetches the latest on every image build.
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Declared here, installed on first boot.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.google.Chrome
          - org.mozilla.firefox
          - com.slack.Slack
          - us.zoom.Zoom
          - org.localsend.localsend_app
          - com.google.AndroidStudio
          - com.getpostman.Postman
          - com.usebruno.Bruno
          - io.kinvolk.Headlamp
          - com.spotify.Client
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.blender.Blender
          - org.kde.kdenlive
          - com.sejda.Sejda
          - com.calibre_ebook.calibre
          - md.obsidian.Obsidian
          - com.usebottles.bottles
          - com.microsoft.Edge
          - org.signal.Signal
          - org.telegram.desktop
          - org.libreoffice.LibreOffice
          - org.videolan.VLC
          - io.mpv.Mpv
          - org.audacityteam.Audacity
          - org.kde.okular
          - org.kde.gwenview
          - com.valvesoftware.Steam
          - org.DolphinEmu.dolphin-emu
          - net.pcsx2.PCSX2
          - net.davidotek.pupgui2
          # Aurora's own defaults. Only Bazaar is preinstalled automatically
          # (/usr/share/flatpak/preinstall.d/), and that preinstall is applied
          # once per remote: this module re-adds the flathub remote, which races
          # flatpak-preinstall.service and leaves it stamped as done with nothing
          # installed. The default panel pins Bazaar, so it ends up a dead
          # launcher. The rest sit behind an interactive `ujust
          # install-system-flatpaks`. Declaring them here covers both.
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.DenysMb.Kontainer
          - io.missioncenter.MissionCenter
          - org.fedoraproject.MediaWriter
          - org.fkoehler.KTailctl
          - org.gnome.DejaDup
          - org.gnome.Firmware
          - org.gtk.Gtk3theme.Breeze
          - org.deskflow.deskflow
          - org.kde.haruna
          - org.kde.kcalc
          - org.kde.kclock
          - org.kde.kontact
          - org.kde.kweather
          - org.kde.qrca
          - org.kde.skanpage
          - org.mozilla.thunderbird
          # system-dx-flatpaks.Brewfile: never offered automatically, because
          # install-system-flatpaks gates them on image-flavor matching "dx" and
          # aurora-dx sets flavor "main".
          - io.podman_desktop.PodmanDesktop
          - io.github.getnf.embellish
          - me.iepure.devtoolbox
      - notify: false
        scope: user

  - type: systemd
    system:
      enabled:
        - aurora-ani-groups.service
        - aurora-ani-groups.path
        - docker.service
    user:
      enabled:
        - ssh-agent.socket
        - syncthing.service
        - aurora-ani-brew.service

  # Requires cosign.pub at the repo root and SIGNING_SECRET as a repo secret.
  - type: signing
