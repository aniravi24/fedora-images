---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: aurora
description: Custom Aurora image.

base-image: ghcr.io/ublue-os/aurora-dx
image-version: stable

modules:
  # Only /etc and /usr: rpm-ostree symlinks the rest to /var.
  - type: files
    files:
      - source: aurora
        destination: /

  # ghostty is not in Fedora and has no Flathub build, hence the COPR.
  - type: dnf
    repos:
      copr:
        - ponesicek/ghostty-bin
    remove:
      packages:
        # Earlier images shipped this for Handy; it cannot work on KWin and
        # Handy picks it in preference to ydotool, so it must not be present.
        - wtype
    install:
      packages:
        # Text injection for Handy. NOT wtype: it needs the compositor to
        # implement zwp_virtual_keyboard_manager_v1, which KWin does not, so it
        # exits with "Compositor does not support the virtual keyboard protocol"
        # on Plasma. Worse, Handy prefers wtype when it is present, so having it
        # installed actively breaks dictation. ydotool goes through /dev/uinput
        # at the kernel level instead and works on any compositor.
        - ydotool
        # Unlocks KWallet with the login password via PAM. Without it KWallet
        # prompts separately at login, and ksshaskpass cannot answer ssh-add
        # until it is unlocked, so an SSH key with a passphrase still prompts.
        # See ublue-os/bluefin#1154. NOTE: the wallet password must match the
        # login password for this to work.
        - kwallet-pam
        - ghostty
        - syncthing
        - gvfs-mtp
        - gvfs-gphoto2
        - gvfs-smb
        # Fonts. Aurora already ships Noto (all scripts + emoji), Cantarell and
        # Adwaita, so only these four are missing for web and code.
        # liberation is metric-compatible with Arial/Times/Courier.
        - liberation-fonts
        - fira-code-fonts
        - adobe-source-code-pro-fonts
        - dejavu-fonts-all

  # Handy (github.com/cjpais/Handy), offline speech-to-text. Not on Flathub and
  # not in any Fedora repo; upstream ships direct downloads only, no repo to
  # subscribe to. The release asset name embeds the version, so
  # /releases/latest/download/ cannot address it and a pinned URL would need
  # bumping by hand. Resolve the latest release at build time instead.
  #
  # The RPM is UNSIGNED (rpm -qi shows "Signature: (none)"), so dnf verifies
  # nothing when installing it from a URL. Upstream signs releases with Tauri's
  # minisign updater key instead, publishing a base64-wrapped .sig alongside
  # each asset and the public key in src-tauri/tauri.conf.json. Verify with
  # that before installing, or this is an unverified binary from the internet
  # running as a desktop app.
  - type: dnf
    install:
      packages:
        - minisign
        - jq

  - type: script
    snippets:
      - |
        set -euo pipefail
        api=https://api.github.com/repos/cjpais/Handy/releases/latest
        meta=$(curl -fsSL "$api")
        url=$(jq -er '.assets[] | select(.name | endswith("x86_64.rpm")) | .browser_download_url' <<<"$meta")
        tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "$url"      -o "$tmp/handy.rpm"
        curl -fsSL "$url.sig"  -o "$tmp/handy.rpm.sig.b64"
        # Tauri base64-wraps the minisign signature file.
        base64 -d "$tmp/handy.rpm.sig.b64" > "$tmp/handy.rpm.minisig"
        curl -fsSL https://raw.githubusercontent.com/cjpais/Handy/main/src-tauri/tauri.conf.json \
          | jq -er '.plugins.updater.pubkey' | base64 -d > "$tmp/handy.pub"
        minisign -Vm "$tmp/handy.rpm" -p "$tmp/handy.pub" -x "$tmp/handy.rpm.minisig" \
          || { echo "Handy signature verification FAILED"; exit 1; }
        echo "installing $url"
        dnf install -y "$tmp/handy.rpm"

  # Nerd Font glyphs for the shell prompt, eza, lazygit. Not packaged by
  # Fedora; this module refetches the latest on every image build.
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode

  # Declared here, installed on first boot.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - com.google.Chrome
          - org.mozilla.firefox
          - com.slack.Slack
          - us.zoom.Zoom
          - org.localsend.localsend_app
          - com.google.AndroidStudio
          - com.getpostman.Postman
          - com.usebruno.Bruno
          - io.kinvolk.Headlamp
          - com.spotify.Client
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.blender.Blender
          - org.kde.kdenlive
          - com.obsproject.Studio
          - com.sejda.Sejda
          - com.calibre_ebook.calibre
          - md.obsidian.Obsidian
          - com.usebottles.bottles
          - com.microsoft.Edge
          - org.signal.Signal
          - org.telegram.desktop
          - org.libreoffice.LibreOffice
          - org.videolan.VLC
          - io.mpv.Mpv
          - org.audacityteam.Audacity
          - com.github.wwmm.easyeffects
          - org.kde.okular
          - org.kde.gwenview
          - com.valvesoftware.Steam
          - org.DolphinEmu.dolphin-emu
          - net.pcsx2.PCSX2
          - net.davidotek.pupgui2
          # Aurora's own defaults. Only Bazaar is preinstalled automatically
          # (/usr/share/flatpak/preinstall.d/), and that preinstall is applied
          # once per remote: this module re-adds the flathub remote, which races
          # flatpak-preinstall.service and leaves it stamped as done with nothing
          # installed. The default panel pins Bazaar, so it ends up a dead
          # launcher. The rest sit behind an interactive `ujust
          # install-system-flatpaks`. Declaring them here covers both.
          - io.github.kolunmi.Bazaar
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
          - io.github.DenysMb.Kontainer
          - io.missioncenter.MissionCenter
          - org.fedoraproject.MediaWriter
          - org.fkoehler.KTailctl
          - org.gnome.DejaDup
          - org.gnome.Firmware
          - org.gtk.Gtk3theme.Breeze
          - org.deskflow.deskflow
          - org.kde.haruna
          - org.kde.kcalc
          - org.kde.kclock
          - org.kde.kontact
          - org.kde.kweather
          - org.kde.qrca
          - org.kde.skanpage
          - org.mozilla.thunderbird
          # system-dx-flatpaks.Brewfile: never offered automatically, because
          # install-system-flatpaks gates them on image-flavor matching "dx" and
          # aurora-dx sets flavor "main".
          # Manages AppImages: moves them somewhere sane, generates a .desktop
          # entry, and updates them in place. Needed because Ledger Live is not
          # on Flathub in any form and ships only an AppImage, and loose
          # AppImages in ~/bin get no launcher entry and never update.
          - it.mijorus.gearlever
          - io.podman_desktop.PodmanDesktop
          - io.github.getnf.embellish
          - me.iepure.devtoolbox
      - notify: false
        scope: user

  - type: systemd
    system:
      enabled:
        - aurora-ani-groups.service
        - aurora-ani-groups.path
        - aurora-ani-mise-selinux.service
        - aurora-ani-signal-desktop.path
        - docker.service
    user:
      enabled:
        - ssh-agent.socket
        - syncthing.service
        - aurora-ani-brew.service
        - ydotoold.service
        - aurora-ani-dotfiles.timer
        - aurora-ani-zprezto-update.timer

  # Requires cosign.pub at the repo root and SIGNING_SECRET as a repo secret.
  - type: signing
